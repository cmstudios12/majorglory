<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — CM Career Studio</title><link rel="stylesheet" href="assets/css/app.css"></head><body><div class="auth-wrap"><aside class="auth-side"><a class="brand" href="index.html"><span class="brandmark">CM</span>Career Studio</a><div><h1>Your career documents, organised professionally.</h1><p>Create CVs, prepare cover letters and check how closely your application matches the role you want.</p></div><p>Secure accounts powered by Supabase Authentication.</p></aside><main class="auth-main"><section class="auth-card"><a class="brand" href="index.html"><span class="brandmark">CM</span>Career Studio</a><div class="auth-tabs"><button id="loginTab" class="active">Sign in</button><button id="registerTab">Create account</button></div><div id="msg"></div>
<form id="loginForm"><div class="field"><label>Email address</label><input id="loginEmail" type="email" autocomplete="email" required></div><div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><span class="help">Use the email you registered with.</span><button type="button" id="forgotBtn" class="btn small">Forgot password?</button></div><button id="loginBtn" class="btn primary" style="width:100%">Sign in</button></form>
<form id="registerForm" class="hidden"><div class="row2"><div class="field"><label>First name</label><input id="regFirst" required></div><div class="field"><label>Last name</label><input id="regLast" required></div></div><div class="field"><label>Email address</label><input id="regEmail" type="email" required></div><div class="field"><label>Password</label><input id="regPassword" type="password" minlength="8" required><span class="help">Use at least 8 characters.</span></div><button id="registerBtn" class="btn primary" style="width:100%">Create account</button></form>
</section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/core.js"></script><script src="assets/js/auth.js"></script></body></html>
